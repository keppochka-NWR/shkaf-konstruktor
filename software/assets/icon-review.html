<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Иллюстрации инструментов</title><style>*{box-sizing:border-box}body{background:#f4f6f8;color:#202934;font:15px/1.5 "Segoe UI",sans-serif;margin:32px}main{max-width:1120px;margin:auto}h1{font-size:24px;margin:0 0 24px}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.item{background:white;border:1px solid #dfe5eb;border-radius:10px;padding:20px;text-align:center}img{width:100%;height:auto;display:block}h2{font-size:17px;margin:6px 0 0}.small{margin-top:24px;display:flex;justify-content:center;gap:24px;flex-wrap:wrap}.small img{width:150px;height:92px}p{color:#687687;font-size:13px;margin-top:28px}@media(max-width:700px){body{margin:18px}.row{grid-template-columns:1fr}.item img{max-width:360px;margin:auto}}</style></head><body><main><h1>Иллюстрации трёх инструментов</h1><div class="row"><div class="item"><img src="tool-kupe.svg" alt="Раздвижные двери"><h2>Двери-купе</h2></div><div class="item"><img src="tool-constructor.svg" alt="Шкаф с выделенной полкой"><h2>Ё Конструктор</h2></div><div class="item"><img src="tool-facades.svg" alt="Фрезеровка и обратная сторона фасада"><h2>Фасады</h2></div></div><p>Проверка уменьшения до 150 px</p><div class="small"><img src="tool-kupe.svg" alt="Купе,150px"><img src="tool-constructor.svg" alt="Конструктор,150px"><img src="tool-facades.svg" alt="Фасады,150px"></div></main></body></html>
