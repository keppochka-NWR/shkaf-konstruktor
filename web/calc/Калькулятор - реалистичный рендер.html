<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор — реалистичный рендер</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text','Helvetica Neue',Arial,sans-serif;background:#ebe8e2;line-height:1.5}
button{cursor:pointer;font:inherit}
input,select{font:inherit}
input:focus,select:focus,button:focus{outline:none}
#app{min-height:100vh;background:#ebe8e2}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="app"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="styles-realistic.jsx"></script>
<script type="text/babel">
const App = () => (
  <DesignCanvas title="Реалистичный рендер дверей-купе" subtitle="Раскладка варианта A с фотореалистичной отрисовкой">
    <DCSection id="real" title="Реалистичная сцена">
      <DCArtboard id="real-a" label="Архитектурная раскладка + фотореалистичные двери" width={1280} height={820}>
        <RealisticArchitectural />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
